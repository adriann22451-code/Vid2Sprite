<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demo Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#121826;--sf:#1a2236;--sf2:#212b43;--ln:#2c3853;--tx:#eaf0fb;--mu:#93a1bd;--ac:#ffc93c;--acd:#a87a00;--acx:#1b1400;--fo:#ffc93c}
@media (prefers-color-scheme:light){:root{--bg:#eef2f9;--sf:#fff;--sf2:#f3f6fb;--ln:#d3dbea;--tx:#141b2d;--mu:#5d6b88;--acd:#c79400;--fo:#1a56db}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Manrope,system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 calc(env(safe-area-inset-bottom,0px) + 32px)}
:focus-visible{outline:2px solid var(--fo);outline-offset:2px}
.w{max-width:820px;margin:0 auto;padding:0 16px}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 0 12px;gap:12px}
.word{font-family:Silkscreen,ui-monospace,monospace;font-size:19px}
a.back{color:var(--mu);font-weight:700;font-size:14px;text-decoration:none;padding:10px 0}
a.back:hover{color:var(--tx)}
canvas{display:block;width:100%;height:auto;border-radius:14px;border:1px solid var(--ln);background:#0c1120;touch-action:manipulation}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:14px 0}
.btn{min-height:48px;padding:0 24px;border:0;border-radius:11px;background:var(--ac);color:var(--acx);font:800 15.5px Manrope,sans-serif;cursor:pointer;box-shadow:0 4px 0 var(--acd)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--acd)}
label.c{display:flex;align-items:center;gap:8px;min-height:44px;font-weight:600;font-size:14px;cursor:pointer}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac)}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-top:14px}
h2{margin:0 0 4px;font-size:16px}
p.s{margin:0 0 12px;color:var(--mu);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.slot{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--ln);border-radius:10px;background:var(--sf2);font-size:13px}
.slot b{font-size:14px}
.slot small{color:var(--mu);overflow-wrap:anywhere}
.slot input{font-size:13px;max-width:100%}
h3{margin:16px 0 8px;font-size:13.5px;color:var(--mu)}
</style>
</head>
<body>
<div class="w">
<header><span class="word">Demo Battle</span><a class="back" href="index.html">Kembali ke tool</a></header>

<canvas id="cv" width="640" height="360" aria-label="Arena battle"></canvas>

<div class="bar">
  <button class="btn" id="go">Serang</button>
  <label class="c"><input type="checkbox" id="auto"> Otomatis</label>
  <label class="c"><input type="checkbox" id="hb"> Tampilkan hitbox</label>
  <label class="c"><input type="checkbox" id="px"> Pixel art</label>
  <label class="c"><input type="checkbox" id="right" checked> Sprite asli menghadap kanan</label>
</div>

<section class="box">
  <h2>Sprite</h2>
  <p class="s">Tanpa file, karakter tampil sebagai kotak biru (pemain) dan merah (musuh). Untuk tiap animasi, pilih file <b>PNG dan JSON sekaligus</b> dari tool (pilih dua file dalam satu kali buka).</p>
  <h3>Pemain</h3>
  <div class="grid">
    <label class="slot"><b>Idle</b><input type="file" multiple accept=".png,.json,image/*,application/json" data-slot="idle"><small>Belum dipilih. JSON idle juga dipakai untuk hitbox.</small></label>
    <label class="slot"><b>Walk</b><input type="file" multiple accept=".png,.json,image/*,application/json" data-slot="walk"><small>Belum dipilih</small></label>
    <label class="slot"><b>Attack</b><input type="file" multiple accept=".png,.json,image/*,application/json" data-slot="attack"><small>Belum dipilih</small></label>
  </div>
  <h3>Musuh</h3>
  <div class="grid">
    <label class="slot"><b>Idle (opsional)</b><input type="file" multiple accept=".png,.json,image/*,application/json" data-slot="eidle"><small>Kosong = memakai idle pemain</small></label>
  </div>
</section>
</div>

<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),W=640,H=360,GY=290,CH=130,P0=110,E0=530;
const spr={idle:null,walk:null,attack:null,eidle:null};

/* ---- muat PNG + JSON ---- */
async function loadPair(files){
  const a=[...files];
  const j=a.find(f=>/\.json$/i.test(f.name)),p=a.find(f=>/\.(png|webp|jpe?g)$/i.test(f.name));
  if(!j||!p)throw new Error('Pilih file PNG dan JSON sekaligus.');
  let meta; try{meta=JSON.parse(await j.text())}catch(e){throw new Error('JSON tidak bisa dibaca.')}
  if(!Array.isArray(meta.frames)||!meta.frames.length||!meta.frameHeight)throw new Error('JSON ini bukan dari tool sprite.');
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('PNG tidak bisa dibaca.'));i.src=URL.createObjectURL(p)});
  return {img,meta};
}
document.querySelectorAll('input[data-slot]').forEach(inp=>inp.addEventListener('change',async()=>{
  const k=inp.dataset.slot,out=inp.parentElement.querySelector('small');
  if(!inp.files.length)return;
  try{spr[k]=await loadPair(inp.files);out.textContent=spr[k].meta.frames.length+' frame dimuat'}
  catch(e){spr[k]=null;out.textContent=e.message}
}));

/* ---- entitas ---- */
const P={x:P0,anim:'idle',t:0,once:false,flip:false,state:'idle'};
const E={x:E0,anim:'idle',t:0,once:false,flip:true,hp:100,hurt:0,fade:1,dead:false};
const floats=[];
let hitDone=false;
const baseFlipP=()=>!$('right').checked, baseFlipE=()=>$('right').checked;
const setA=(e,a,once)=>{e.anim=a;e.t=0;e.once=once};

const sheetOf=e=>e===E?(spr.eidle||spr.idle):spr[e.anim];
function frameInfo(e){
  const s=sheetOf(e);
  if(!s)return {s:null,n:8,fps:10};
  return {s,n:s.meta.frames.length,fps:s.meta.fps||10};
}
function frameIdx(e){
  const c=frameInfo(e),i=Math.floor(e.t/1000*c.fps);
  return e.once?Math.min(i,c.n-1):i%c.n;
}
/* hitbox (dari idle) dalam piksel kanvas, relatif ke sel frame */
function hbOf(e){
  const s=e===E?(spr.eidle||spr.idle):spr.idle;
  if(!s)return {cw:CH,x:45,y:15,w:40,h:100};
  const m=s.meta,k=CH/m.frameHeight;
  const h=m.hitbox||{x:m.frameWidth*.3,y:m.frameHeight*.1,w:m.frameWidth*.4,h:m.frameHeight*.8};
  return {cw:m.frameWidth*k,x:h.x*k,y:h.y*k,w:h.w*k,h:h.h*k};
}
function wbox(e){
  const b=hbOf(e);
  const l=e.flip?e.x+b.cw/2-(b.x+b.w):e.x-b.cw/2+b.x,t=GY-.92*CH+b.y;
  return {l,r:l+b.w,t,b:t+b.h};
}

/* ---- alur battle ---- */
function go(){
  if(P.state!=='idle'||E.dead)return;
  P.state='walk';P.flip=baseFlipP();setA(P,'walk',false);
}
function strike(){
  const d=10+Math.floor(Math.random()*6);
  E.hp-=d;E.hurt=350;
  floats.push({x:E.x,y:GY-.92*CH,t:0,txt:'-'+d});
  if(E.hp<=0){E.hp=0;E.dead=true;setTimeout(()=>{E.hp=100;E.fade=1;E.dead=false},1400)}
}
function update(dt){
  P.t+=dt;E.t+=dt;
  E.flip=baseFlipE();
  const sp=230*dt/1000;
  if(P.state==='walk'){
    const pb=wbox(P),eb=wbox(E),stop=eb.l-12;
    if(pb.r+sp>=stop){P.x+=stop-pb.r;P.state='attack';hitDone=false;setA(P,'attack',true)}
    else P.x+=sp;
  }else if(P.state==='attack'){
    const c=frameInfo(P),i=frameIdx(P);
    if(!hitDone&&i>=Math.floor(c.n*.5)){hitDone=true;strike()}
    if(P.t/1000*c.fps>=c.n){P.state='back';P.flip=!baseFlipP();setA(P,'walk',false)}
  }else if(P.state==='back'){
    P.x-=sp;
    if(P.x<=P0){P.x=P0;P.state='idle';P.flip=baseFlipP();setA(P,'idle',false)}
  }else{
    P.flip=baseFlipP();
    if($('auto').checked&&!E.dead&&P.t>700)go();
  }
  if(E.hurt>0)E.hurt=Math.max(0,E.hurt-dt);
  if(E.dead)E.fade=Math.max(0,E.fade-dt/600);
  floats.forEach(f=>{f.t+=dt;f.y-=dt*.04});
  while(floats.length&&floats[0].t>800)floats.shift();
}

/* ---- gambar ---- */
function placeholder(e,i){
  const top=GY-.92*CH,bob=Math.sin(i/8*Math.PI*2)*(e.anim==='walk'?5:2);
  ctx.fillStyle=e===E?'#ff6b6b':'#4da3ff';ctx.fillRect(-20,top+15+bob,40,100);
  ctx.fillStyle='#fff';ctx.fillRect(6,top+30+bob,8,8);
  if(e.anim==='attack'){ctx.strokeStyle='#ffd166';ctx.lineWidth=6;ctx.beginPath();ctx.arc(20,top+60,50,-1.2+i*.35,-.4+i*.35);ctx.stroke()}
}
function drawE(e){
  const c=frameInfo(e),i=frameIdx(e),top=GY-.92*CH;
  const blink=e.hurt>0&&Math.floor(e.hurt/60)%2;
  ctx.save();
  ctx.globalAlpha=(e.fade===undefined?1:e.fade)*(blink?.4:1);
  ctx.translate(e.x+(e.hurt>0?Math.sin(e.hurt/15)*4:0),0);
  if(e.flip)ctx.scale(-1,1);
  if(c.s){
    const m=c.s.meta,k=CH/m.frameHeight,f=m.frames[i],cw=m.frameWidth*k;
    ctx.drawImage(c.s.img,f.x,f.y,f.w,f.h,-cw/2,top,cw,CH);
  }else placeholder(e,i);
  ctx.restore();
}
function drawBox(b){
  ctx.strokeStyle='#ff4d6d';ctx.lineWidth=2;ctx.setLineDash([5,4]);
  ctx.strokeRect(b.l,b.t,b.r-b.l,b.b-b.t);ctx.setLineDash([]);
}
function draw(){
  ctx.imageSmoothingEnabled=!$('px').checked;
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1d2b4a');g.addColorStop(1,'#0c1120');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#233252';ctx.fillRect(0,GY,W,H-GY);
  ctx.fillStyle='#2f4270';ctx.fillRect(0,GY,W,3);
  drawE(E);drawE(P);
  if($('hb').checked){drawBox(wbox(E));drawBox(wbox(P))}
  if(E.fade>0){
    const bx=E.x-40,by=GY-.92*CH-18;
    ctx.globalAlpha=E.fade;
    ctx.fillStyle='#000a';ctx.fillRect(bx,by,80,8);
    ctx.fillStyle='#4de1c1';ctx.fillRect(bx,by,80*E.hp/100,8);
    ctx.globalAlpha=1;
  }
  ctx.font='800 20px Manrope,sans-serif';ctx.textAlign='center';
  floats.forEach(f=>{ctx.globalAlpha=Math.max(0,1-f.t/800);ctx.fillStyle='#ffc93c';ctx.fillText(f.txt,f.x,f.y);});
  ctx.globalAlpha=1;
}

let last=performance.now();
function loop(now){
  const dt=Math.min(50,now-last);last=now;
  update(dt);draw();requestAnimationFrame(loop);
}
$('go').onclick=go;
cv.addEventListener('click',go);
requestAnimationFrame(loop);
</script>
</body>
</html>
